<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercado Go | Autenticação</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #ebebeb; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
    header { background-color: #ffe600; padding: 14px 24px; border-bottom: 1px solid rgba(0,0,0,.1); }
    .brand { font-size: 20px; font-weight: bold; color: #2d3277; text-decoration: none; display: flex; align-items: center; gap: 6px; }

    .login-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .auth-card { background: #fff; border-radius: 8px; width: 100%; max-width: 440px; padding: 32px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    .tabs { display: flex; border-bottom: 2px solid #f1f5f9; margin-bottom: 24px; }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 15px; font-weight: 600; color: #64748b; cursor: pointer; text-align: center; }
    .tab-btn.active { color: #3483fa; border-bottom: 2px solid #3483fa; margin-bottom: -2px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #3483fa; }

    .form-row { display: flex; gap: 10px; }

    .btn-submit { width: 100%; background: #3483fa; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-submit:hover { background: #2968c8; }

    .quick-access { margin-top: 24px; padding-top: 16px; border-top: 1px solid #f1f5f9; }
    .quick-access h4 { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
    .quick-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-quick { background: #f8fafc; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; color: #334155; cursor: pointer; }
    .btn-quick:hover { background: #e2e8f0; }

    .error-box { display: none; background: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <header>
    <a href="/login.html" class="brand">⚡ mercado<strong>go</strong></a>
  </header>

  <div class="login-container">
    <div class="auth-card">
      <div id="errorBox" class="error-box"></div>

      <div class="tabs">
        <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">Entrar</button>
        <button class="tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">Criar Conta</button>
      </div>

      <!-- Formulário de Login -->
      <div id="loginView">
        <form id="formLogin">
          <div class="form-group">
            <label>Usuário</label>
            <input type="text" id="loginUsername" placeholder="Ex: elaine, lucas ou hebert" required autofocus />
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="loginPassword" placeholder="Sua senha" required />
          </div>
          <button type="submit" class="btn-submit">Entrar na Loja</button>
        </form>

        <div class="quick-access">
          <h4>Preenchimento Rápido (Teste):</h4>
          <div class="quick-buttons">
            <button class="btn-quick" onclick="quickFill('elaine', '123456')">Elaine (123456)</button>
            <button class="btn-quick" onclick="quickFill('lucas', '123456')">Lucas (123456)</button>
            <button class="btn-quick" onclick="quickFill('admin', 'admin123')">Admin (admin123)</button>
          </div>
        </div>
      </div>

      <!-- Formulário de Registro -->
      <div id="registerView" style="display: none;">
        <form id="formRegister">
          <div class="form-row">
            <div class="form-group" style="flex:1;">
              <label>Usuário (Username)</label>
              <input type="text" id="regUsername" placeholder="Ex: hebert" required />
            </div>
            <div class="form-group" style="flex:1;">
              <label>Senha</label>
              <input type="password" id="regPassword" placeholder="Defina sua senha" required />
            </div>
          </div>
          <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="regName" placeholder="Ex: Hebert Silva" required />
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:1;">
              <label>E-mail</label>
              <input type="email" id="regEmail" placeholder="hebert@email.com" required />
            </div>
            <div class="form-group" style="flex:1;">
              <label>Telefone</label>
              <input type="text" id="regPhone" placeholder="(11) 91234-5678" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:2;">
              <label>Rua/Logradouro</label>
              <input type="text" id="regStreet" placeholder="Rua Central" />
            </div>
            <div class="form-group" style="flex:1;">
              <label>Número</label>
              <input type="text" id="regNumber" placeholder="123" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:1;">
              <label>Cidade</label>
              <input type="text" id="regCity" placeholder="São Paulo" />
            </div>
            <div class="form-group" style="flex:1;">
              <label>CEP</label>
              <input type="text" id="regZip" placeholder="01000-000" />
            </div>
          </div>
          <button type="submit" class="btn-submit" style="background:#00a650;">Concluir Cadastro & Entrar</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("unauthorized")) {
      showError("Acesso restrito: faça login com a conta 'admin' para acessar o Backoffice.");
    }

    function showError(msg) {
      const el = document.getElementById("errorBox");
      el.style.display = "block";
      el.innerText = msg;
    }

    function switchTab(tab) {
      document.getElementById("errorBox").style.display = "none";
      if (tab === 'login') {
        document.getElementById("loginView").style.display = "block";
        document.getElementById("registerView").style.display = "none";
        document.getElementById("tabLoginBtn").classList.add("active");
        document.getElementById("tabRegisterBtn").classList.remove("active");
      } else {
        document.getElementById("loginView").style.display = "none";
        document.getElementById("registerView").style.display = "block";
        document.getElementById("tabRegisterBtn").classList.add("active");
        document.getElementById("tabLoginBtn").classList.remove("active");
      }
    }

    function quickFill(user, pass) {
      document.getElementById("loginUsername").value = user;
      document.getElementById("loginPassword").value = pass;
    }

    async function doLogin(username, password) {
      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Erro ao efetuar login");
        }

        if (data.user.role === "admin") {
          window.location.href = "/admin.html";
        } else {
          window.location.href = "/";
        }
      } catch (err) {
        showError(err.message);
      }
    }

    document.getElementById("formLogin").onsubmit = async (e) => {
      e.preventDefault();
      await doLogin(
        document.getElementById("loginUsername").value,
        document.getElementById("loginPassword").value
      );
    };

    document.getElementById("formRegister").onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        username: document.getElementById("regUsername").value,
        password: document.getElementById("regPassword").value,
        name: document.getElementById("regName").value,
        email: document.getElementById("regEmail").value,
        phone: document.getElementById("regPhone").value,
        address_street: document.getElementById("regStreet").value,
        address_number: document.getElementById("regNumber").value,
        address_city: document.getElementById("regCity").value,
        address_zip: document.getElementById("regZip").value
      };

      try {
        const res = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Erro ao cadastrar");
        }

        window.location.href = "/";
      } catch (err) {
        showError(err.message);
      }
    };
  </script>
</body>
</html>
